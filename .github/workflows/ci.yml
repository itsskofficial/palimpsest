name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    # The README says Supabase works unchanged. That is a claim about *equivalence*
    # between two stores, and the only way to check it is to run one suite against
    # both -- so there is a real Postgres here rather than a mock. Without it the
    # 430 statements in `postgres.py` were never executed by anything, and "works
    # unchanged" was a sentence nobody had tested.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: palimpsest
          POSTGRES_DB: palimpsest_test
        ports: ["5432:5432"]
        # Without the health check the suite starts before the server accepts
        # connections and fails on a timeout that looks like a bug in the store.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PALIMPSEST_TEST_POSTGRES: postgresql://postgres:palimpsest@127.0.0.1:5432/palimpsest_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Types
        run: mypy src/palimpsest
      - name: Architectural invariants (4 contracts)
        run: lint-imports
      - name: Tests
        run: pytest -v --cov=palimpsest --cov-report=term-missing

  offline:
    # The claim that the decision layer runs with no dependencies and no keys. If this
    # job ever needs an extra, "sweep duplicates works before you have an API key" is
    # no longer true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . && pip install pytest
      - name: Import and run the offline core with no optional dependencies
        run: |
          python -c "
          import palimpsest as pal
          from palimpsest.retrieve import Index
          store = pal.open_store('sqlite://:memory:')
          store.put_pages([{'page_id': 'p1', 'title': 'A', 'last_edited': 'x'},
                           {'page_id': 'p2', 'title': 'B', 'last_edited': 'y'}])
          text = 'Scaled dot-product attention divides by the square root of the key dimension.'
          store.put_blocks([
              {'block_id': 'b1', 'page_id': 'p1', 'type': 'paragraph', 'text': text, 'position': 0},
              {'block_id': 'b2', 'page_id': 'p2', 'type': 'paragraph', 'text': text, 'position': 0},
          ])
          found = pal.sweep.duplicates(store)
          assert len(found) == 1, found.as_dict()
          print('duplicate sweep with no dependencies and no keys:', found.summary())
          "
      - name: No optional dependency leaked into the default install
        run: |
          ! pip show anthropic openai fastapi psycopg2-binary pypdf 2>/dev/null | grep -q Name
      - name: The end-to-end walkthrough runs offline
        run: pip install -e ".[dev]" && python scripts/walkthrough.py
      - name: Sync, ingest, apply and undo against a real workspace
        # The write path used to be untestable without a Notion token, which is
        # why the most dangerous code here had the weakest offline coverage. A
        # markdown vault closes that: this is the real mirror, the real planner,
        # the real write door and the real inverse logic, and it asserts the file
        # on disk comes back byte-identical after undo.
        run: pytest tests/unit/test_vault_pipeline.py tests/unit/test_workspace.py -v
      - name: The demo installs and mirrors with nothing configured
        # The first thirty seconds of a new user, checked on a machine that has
        # never been set up -- which is the only place that check means anything.
        run: palimpsest demo --dir /tmp/demo-vault --no-serve

  safety:
    # The guard-rails, checked explicitly rather than trusted. Each of these is a
    # promise in the README, and a regression in any of them is a data-loss bug.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Contradictions apply only at the top rung, and only as a record
        run: |
          python -c "
          from palimpsest.config import AUTONOMY_LEVELS, Settings
          from palimpsest.types import Relation
          assert Relation.CONTRADICTS.auto_appliable is False
          assert 'high' not in AUTONOMY_LEVELS
          for level in AUTONOMY_LEVELS:
              if level == 'everything':
                  continue
              assert not Settings(apply=True, autonomy=level).may_auto_apply('high'), level
          assert Settings(apply=True, autonomy='everything').may_auto_apply('high')
          assert not Settings(apply=False, autonomy='everything').may_auto_apply('high')
          print('contradictions apply only at autonomy=everything, and only with apply=on')
          "
      - name: What that rung applies is a record, never a rewrite
        # The property that makes the top rung offerable: the system never decides which
        # of two sourced claims is true. It appends the disagreement beside the line and
        # leaves the line alone, so the whole thing inverts by removing one block.
        run: |
          python -c "
          from palimpsest.plan import plan
          from palimpsest.types import Claim, ClaimType, Judgement, OpKind, Relation, Source, new_id
          class S:
              def get_page(self, _): return None
              def get_block(self, _): return None
          claim = Claim(claim_id=new_id('clm_'), text='The opposite holds.', type=ClaimType.FACT, topics=())
          j = Judgement(claim_id=claim.claim_id, relation=Relation.CONTRADICTS, confidence=0.99,
                        target_block_id='bk1', target_page_id='pg1', rationale='r', model='m')
          src = Source(source_id=new_id('src_'), kind='text', title='t', text=claim.text)
          result = plan([j], {claim.claim_id: claim}, src, S(), record_contradictions=True)
          kinds = {op.kind for op in result.patch.operations}
          assert kinds == {OpKind.APPEND_BLOCK}, kinds
          assert not (kinds & {OpKind.UPDATE_TEXT, OpKind.STRIKE_BLOCK, OpKind.ARCHIVE_BLOCK})
          print('a recorded contradiction is one append and edits nothing')
          "
      - name: apply=off vetoes every relation
        run: |
          python -c "
          from palimpsest.config import Settings
          s = Settings(apply=False, autonomy='everything')
          assert not any(s.may_auto_apply(r) for r in ('low', 'medium', 'high'))
          print('apply=off vetoes every relation')
          "
      - name: Only notion.apply writes to Notion
        run: lint-imports
      - run: pytest tests/unit/test_apply.py tests/unit/test_serve.py -v

  clients:
    # The extension and the desktop shell, neither of which was tested by anything
    # that ran automatically. Both are how most people will actually meet this
    # project, and both fail in the same shape: a file present on the developer's
    # disk and absent from the list that gets packaged, which passes every check
    # here and breaks totally on somebody else's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm install
        working-directory: clients
      - name: Extension and desktop shell
        run: npm test
        working-directory: clients
      - name: Every shell file parses
        # `node --check` on the Electron entry points. They import `electron`, which
        # is not importable outside Electron, so a syntax error in them is otherwise
        # found by launching the app -- which nothing in CI does.
        run: node --check clients/desktop/main.js && node --check clients/desktop/backend.js
      - name: The extension packs into something installable
        run: |
          node clients/extension/pack.mjs
          python -c "import zipfile,glob,sys; z=glob.glob('clients/extension/dist/*.zip')[0]; sys.exit(zipfile.ZipFile(z).testzip() or 0)"

  ui:
    # The interface is TypeScript and it ships inside the Python package, so a type error
    # in it is a broken release even though no Python changed. `next build` type-checks
    # and lints as part of the build, which is why there is no separate step for either.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/ui/package-lock.json
      - run: npm ci
        working-directory: clients/ui
      - run: npm run build
        working-directory: clients/ui
      - name: The committed export matches a fresh build
        # Not a byte-for-byte diff — hashed filenames make that brittle across Node
        # patch versions. This asserts the weaker, useful thing: the copy in the package
        # is complete, so `pip install` serves a UI that actually loads.
        # `pip install -e .` because the shared conftest imports palimpsest. The core has
        # no dependencies, so this costs a couple of seconds.
        run: |
          node clients/ui/scripts/ship.mjs
          pip install -e . pytest
          python -m pytest tests/unit/test_ui_bundle.py -q
