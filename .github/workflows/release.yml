name: Release

# Installers, built where they can be built.
#
# Packaging for Windows, macOS and Linux from one laptop is not possible, and packaging
# for Windows from a laptop without developer mode enabled is not possible either — the
# code-signing toolchain electron-builder unpacks contains symlinks that Windows refuses
# to create without the privilege. A tagged runner has both, so this is where the
# installers people actually download come from.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    # The installers do not contain the UI. They contain an Electron shell that installs
    # `palimpsest-notion` from PyPI on first run and points a window at it, so the
    # interface people see is the one in whichever release of the Python package they
    # end up with — not one frozen into the .exe at tag time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: "clients/desktop/dist/*-setup.exe"
          - os: macos-latest
            artifact: "clients/desktop/dist/*.dmg"
          - os: ubuntu-latest
            artifact: "clients/desktop/dist/*.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: clients/desktop
      # The tag is the version of record. Without this the installer would be named for
      # whatever is in package.json, so `v0.2.0` could ship `palimpsest-0.1.0-setup.exe`
      # and nobody could tell from the filename what they had downloaded.
      - name: Name the shell after the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: clients/desktop
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      # Unsigned on purpose. A certificate is a per-publisher secret this repository does
      # not have; users get a SmartScreen warning, which is honest about what this is.
      - run: npx electron-builder --publish never
        working-directory: clients/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # The extension, zipped so that installing it is a file you drag rather than a
  # repository you clone. Not the Chrome Web Store -- that needs a developer account
  # and a review -- but it is the difference between `chrome://extensions -> Load
  # unpacked -> point at this folder` and something you can hand to somebody.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: clients
      - name: The tests that guard what gets packed
        run: npm test
        working-directory: clients
      - run: node clients/extension/pack.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: clients/extension/dist/*.zip
          if-no-files-found: error

  # The Python package, published by PyPI's trusted publishing rather than a token.
  #
  # This matters more here than it usually would. The installers do not contain the
  # product -- they are an Electron shell that installs `palimpsest-notion` from PyPI on
  # first run -- so a tag that ships installers without publishing the package produces
  # an app that downloads the *previous* release and silently behaves like it.
  #
  # No PYPI_TOKEN secret: PyPI mints a short-lived credential from this workflow's OIDC
  # identity, so there is no long-lived token to leak, rotate, or forget to rotate. It
  # needs a one-time trusted publisher configured at
  # https://pypi.org/manage/project/palimpsest-notion/settings/publishing/
  # naming this repository, `release.yml`, and the `pypi` environment.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      # The tag is the version of record here too. Publishing a wheel whose version
      # disagrees with the tag is unrecoverable, because a PyPI version can never be
      # reused -- so this fails the release rather than shipping the wrong number.
      - name: The tag and the package version must agree
        run: |
          python - <<'PY'
          import os, pathlib, sys
          built = {p.name.split("-")[1] for p in pathlib.Path("dist").glob("*.whl")}
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if built != {tag}:
              sys.exit(f"tag {tag!r} but built {sorted(built)}")
          print(f"tag and wheel agree on {tag}")
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish:
    needs: [installers, extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # Everything the matrix and the extension job uploaded, not just `installer-*` --
      # the narrower pattern silently published a release with no extension in it.
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: installers
      # The changelog, not a list of commit subjects. `generate_release_notes` produces
      # the latter, which reads as an internal log rather than as an answer to "should I
      # upgrade" -- and the answer to that is already written, once, in CHANGELOG.md.
      - uses: actions/checkout@v4
      - name: The notes for this version
        shell: bash
        run: |
          python - <<'PY' > notes.md
          import pathlib, re
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          import os
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          blocks = re.split(r"^## ", text, flags=re.M)
          section = next((b for b in blocks if b.startswith(version)), "")
          print(("## " + section).strip() if section else
                f"See CHANGELOG.md for {version}.")
          PY
          head -5 notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          body_path: notes.md
