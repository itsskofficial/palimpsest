name: Release

# Installers, built where they can be built.
#
# Packaging for Windows, macOS and Linux from one laptop is not possible, and packaging
# for Windows from a laptop without developer mode enabled is not possible either — the
# code-signing toolchain electron-builder unpacks contains symlinks that Windows refuses
# to create without the privilege. A tagged runner has both, so this is where the
# installers people actually download come from.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    # Built once and shared, so all three installers wrap byte-identical assets and the
    # export cannot differ between platforms.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/ui/package-lock.json
      - run: npm ci
        working-directory: clients/ui
      - run: npm run build && node scripts/ship.mjs
        working-directory: clients/ui
      - name: The export the package will serve
        uses: actions/upload-artifact@v4
        with:
          name: ui-static
          path: src/palimpsest/serve/static/

  installers:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: "clients/desktop/dist/*-setup.exe"
          - os: macos-latest
            artifact: "clients/desktop/dist/*.dmg"
          - os: ubuntu-latest
            artifact: "clients/desktop/dist/*.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Take the shared export
        uses: actions/download-artifact@v4
        with:
          name: ui-static
          path: src/palimpsest/serve/static/
      - run: npm install
        working-directory: clients/desktop
      # Unsigned on purpose. A certificate is a per-publisher secret this repository does
      # not have; users get a SmartScreen warning, which is honest about what this is.
      - run: npx electron-builder --publish never
        working-directory: clients/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: installers
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
