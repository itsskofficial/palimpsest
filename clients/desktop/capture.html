<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>palimpsest</title>
    <link rel="stylesheet" href="capture.css" />
  </head>
  <body>
    <div id="drop-veil" class="veil" hidden><span>Drop to capture</span></div>

    <main id="view-capture">
      <header class="bar">
        <span class="brand">palimpsest</span>
        <span id="status" class="status">starting…</span>
      </header>

      <textarea
        id="input"
        placeholder="Paste a link, a transcript, or a thought.&#10;Drop files anywhere on this window.&#10;&#10;Enter to capture · Shift+Enter for a new line · Esc to dismiss"
        autofocus
      ></textarea>

      <div class="row">
        <label class="check">
          <input type="checkbox" id="as-transcript" />
          <span>Transcript (keep timestamps)</span>
        </label>
        <div class="actions">
          <button id="browse" class="ghost">Files…</button>
          <button id="send" class="primary">Capture</button>
        </div>
      </div>

      <div id="result" class="result" hidden></div>

      <footer class="bar bar--foot">
        <button id="review" class="link">Open palimpsest →</button>
        <button id="settings" class="link">Settings</button>
      </footer>
    </main>

    <script src="capture.js"></script>
  </body>
</html>
