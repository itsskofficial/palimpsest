[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palimpsest"
version = "0.1.0"
description = "A self-maintaining knowledge base on top of Notion: extracts claims from anything, classifies how each one relates to what you already wrote, and applies small reversible patches with full provenance."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Sarthak Karandikar" }]
keywords = [
    "notion",
    "knowledge-base",
    "personal-knowledge-management",
    "claude",
    "provenance",
    "claim-extraction",
    "second-brain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Indexing",
]

# ---------------------------------------------------------------------------
# The default install has no dependencies.
#
# The mirror, the retrieval index (BM25 + character n-grams), the patch planner,
# the reverse-patch algebra, the sweeps and the whole SQLite store are standard
# library. That is what lets `palimpsest sweep duplicates` run against a synced
# workspace with no API key at all, and what keeps the test suite offline.
#
# Claude is an extra because it is the one thing with no local equivalent.
# ---------------------------------------------------------------------------
dependencies = []

[project.optional-dependencies]
# The model. Claude does claim extraction, relation classification and
# contradiction adjudication. Official SDK, not raw HTTP.
anthropic = ["anthropic>=0.69"]

# Optional dense retrieval on top of the built-in lexical index.
embed = ["openai>=1.30"]

# Ingestion adapters that need more than urllib.
firecrawl = ["firecrawl-py>=2.0"]
pdf = ["pypdf>=4.2"]
tabular = ["openpyxl>=3.1"]

# The platform, local or deployed.
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
postgres = ["psycopg2-binary>=2.9"]
aws = ["boto3>=1.34"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9",
    "anthropic>=0.69",
]
all = ["palimpsest[anthropic,embed,pdf,tabular,serve,postgres,aws]"]

[project.urls]
Homepage = "https://github.com/itsskofficial/palimpsest"
Documentation = "https://github.com/itsskofficial/palimpsest#readme"
Issues = "https://github.com/itsskofficial/palimpsest/issues"

[project.scripts]
palimpsest = "palimpsest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "api: needs a live Anthropic key and network access",
    "notion: needs a live Notion integration token",
    "serve: needs the serve extra (fastapi + httpx)",
    "postgres: needs a reachable Postgres at PALIMPSEST_TEST_POSTGRES_URL",
    "supabase_stack: needs the local Supabase stack (python scripts/dev.py up)",
]
addopts = "-m 'not api and not notion and not postgres' --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/RUF002/RUF003: the prose and the heading-path separator deliberately use
# typographic characters. `_console.py` handles the terminals that cannot render them.
ignore = ["E501", "B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Architectural invariants, enforced in CI. Each is a README claim that stops
# being true the moment the contract breaks.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["palimpsest"]
include_external_packages = true

# 1. Layers stack downward only.
[[tool.importlinter.contracts]]
name = "Layers stack downward only"
type = "layers"
layers = [
    "palimpsest.cli",
    "palimpsest.serve",
    "palimpsest.sweep",
    "palimpsest.pipeline",
    "palimpsest.plan",
    "palimpsest.relate",
    "palimpsest.retrieve",
    "palimpsest.extract",
    "palimpsest.ingest",
    "palimpsest.notion",
    "palimpsest.llm",
    "palimpsest.store",
    "palimpsest.types",
]

# 2. Nothing but the applier may write to Notion. The whole safety story - every
#    change reversible, every change provenanced - rests on there being exactly
#    one code path that mutates the workspace.
[[tool.importlinter.contracts]]
name = "Only notion.apply may perform Notion writes"
type = "forbidden"
source_modules = [
    "palimpsest.types",
    "palimpsest.retrieve",
    "palimpsest.relate",
    "palimpsest.plan",
    "palimpsest.extract",
    "palimpsest.sweep",
]
forbidden_modules = ["palimpsest.notion.apply"]

# 3. The library must never depend on the web layer.
[[tool.importlinter.contracts]]
name = "Nothing outside serve/ may import the web layer"
type = "forbidden"
source_modules = [
    "palimpsest.types",
    "palimpsest.store",
    "palimpsest.llm",
    "palimpsest.notion",
    "palimpsest.ingest",
    "palimpsest.extract",
    "palimpsest.retrieve",
    "palimpsest.relate",
    "palimpsest.plan",
    "palimpsest.pipeline",
    "palimpsest.sweep",
]
forbidden_modules = ["palimpsest.serve", "fastapi", "uvicorn", "starlette"]

# 4. The offline core stays dependency-free. `llm` and `ingest.*` are absent by
#    design - wrapping an optional dependency is their entire job. The runtime
#    version of this check lives in tests/unit/test_extras.py.
[[tool.importlinter.contracts]]
name = "The offline core stays dependency-free"
type = "forbidden"
source_modules = [
    "palimpsest.types",
    "palimpsest.retrieve",
    "palimpsest.plan",
    "palimpsest.notion.blocks",
    "palimpsest.store.sqlite",
    "palimpsest.store.stats",
    "palimpsest.store.migrations",
]
forbidden_modules = ["anthropic", "openai", "fastapi", "psycopg2", "numpy", "firecrawl"]
